apiVersion: v1
kind: Namespace
metadata:
  name: todo-app

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  namespace: todo-app
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "tododb"
  DB_USER: "postgres"
  PORT: "4000"
  FRONTEND_URL: "http://frontend-service"

---
apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
  namespace: todo-app
type: Opaque
stringData:
  DB_PASSWORD: "postgres"
